name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Choose release version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          CURRENT="$(python -I scripts/bump_version.py --current)"
          if git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            # This version was already released, so make the next patch release.
            VERSION="$(python -I scripts/bump_version.py)"
            echo "v$CURRENT is already tagged; bumping to $VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock crates/wheel-app/tauri.conf.json ui/package.json ui/package-lock.json
            git commit -m "chore: release $VERSION [skip release]"
            git push origin HEAD:main
          else
            # A manually bumped version has not been released yet; publish it as-is.
            VERSION="$CURRENT"
            echo "releasing committed version $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Warm cargo cache
        run: cargo fetch

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python -I scripts/release.py

      - name: Tag release
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v$VERSION" -m "Wheel Tracker v$VERSION"
          git push origin "v$VERSION"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Wheel Tracker v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/Wheel Tracker_${{ steps.bump.outputs.version }}_x64-setup.exe
            target/release/bundle/nsis/Wheel Tracker_${{ steps.bump.outputs.version }}_x64-setup.exe.sig
            dist/release/Wheel Tracker_${{ steps.bump.outputs.version }}_x64-setup.exe.sha256
            dist/release/release-manifest.json
            dist/release/latest.json
