[workspace]
resolver = "2"
members = ["crates/wheel-core", "crates/wheel-app", "crates/wheel-mobile"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
